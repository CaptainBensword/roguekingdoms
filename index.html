<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Fall</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c9e8}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block;width:100vw;height:100vh}#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;color:rgba(255,255,255,.9);background:rgba(24,50,65,.35);backdrop-filter:blur(8px);font-size:13px;pointer-events:none;transition:opacity .6s}#hint.hide{opacity:0}</style></head><body><canvas id="game"></canvas><div id="hint">A / D or ← / → to move · Space to jump · Shift to dash</div><script>
(()=>{"use strict";const c=document.getElementById('game'),x=c.getContext('2d'),hint=document.getElementById('hint');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();const keys=new Set();let jp=false,dp=false,state='menu',cam=0,camY=0,start=0,elapsed=0,score=0,gems=0,best=+localStorage.getItem('freefall_best')||0;addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','shift'].includes(k))e.preventDefault();keys.add(k);if([' ','w','arrowup'].includes(k))jp=true;if(k==='shift')dp=true;if(k==='r')restart();if(k==='escape')state='menu'});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));const down=(...a)=>a.some(k=>keys.has(k));const ps=[[-300,620,900,80],[820,540,330,40],[1240,460,330,40],[1670,570,420,40],[2180,430,300,40],[2580,350,360,40],[3050,500,420,40],[3550,390,300,40],[3990,300,360,40],[4450,455,400,40],[4940,350,300,40],[5360,520,420,40],[5900,420,350,40],[6360,300,420,40],[6900,500,500,80]].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));const gs=[[450,550],[950,470],[1360,390],[1830,500],[2290,360],[2730,280],[3200,450],[3650,340],[4120,250],[4600,405],[5050,300],[5500,470],[6030,370],[6510,250],[7100,450]].map(([a,b],i)=>({x:a,y:b,t:i*.7,got:false}));const es=[{x:1020,y:505,w:28,h:28,v:1.2,min:850,max:1120},{x:1870,y:535,w:30,h:30,v:-1.1,min:1690,max:2040},{x:3190,y:465,w:30,h:30,v:1.3,min:3070,max:3430},{x:4550,y:420,w:30,h:30,v:-1.4,min:4470,max:4810},{x:5480,y:485,w:32,h:32,v:1.2,min:5380,max:5730},{x:6100,y:385,w:30,h:30,v:-1.5,min:5920,max:6210}];const p={x:120,y:520,w:30,h:42,vx:0,vy:0,max:7.5,acc:.72,g:.62,j:-13.3,jumps:0,ground:false,face:1,dash:0,cd:0,inv:0};function reset(){p.x=120;p.y=520;p.vx=p.vy=0;p.jumps=0;p.dash=p.cd=0;p.inv=80;cam=camY=0;gems=score=0;gs.forEach(g=>g.got=false);start=performance.now();es.forEach((e,i)=>{e.x=[1020,1870,3190,4550,5480,6100][i];e.v=i%2?-1.2:1.2})}function restart(){state='play';reset();hint.classList.remove('hide');setTimeout(()=>hint.classList.add('hide'),4500)}function jump(){if(p.ground){p.vy=p.j;p.ground=false;p.jumps=1}else if(p.jumps<2){p.vy=p.j*.92;p.jumps=2}}function dash(){if(p.cd<=0){p.dash=12;p.cd=42;p.inv=Math.max(p.inv,18);p.vx=p.face*14;p.vy*=.25}}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function respawn(){p.x=120;p.y=520;p.vx=p.vy=0;p.jumps=0;p.inv=100}function update(){if(state!=='play')return;elapsed=(performance.now()-start)/1000;if(jp){jump();jp=false}if(dp){dash();dp=false}if(p.inv>0)p.inv--;if(p.cd>0)p.cd--;let l=down('a','arrowleft'),r=down('d','arrowright');if(p.dash<=0){if(l){p.vx-=p.acc;p.face=-1}if(r){p.vx+=p.acc;p.face=1}if(!l&&!r)p.vx*=.82;p.vx=Math.max(-p.max,Math.min(p.max,p.vx));p.vy+=p.g}else{p.dash--;p.vx*=.97;p.vy*=.94}let oy=p.y;p.x+=p.vx;p.y+=p.vy;p.ground=false;for(const q of ps)if(p.x+p.w>q.x&&p.x<q.x+q.w&&oy+p.h<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true;p.jumps=0}p.x=Math.max(0,Math.min(7200,p.x));gs.forEach(g=>{g.t+=.06;if(!g.got&&Math.abs(p.x+15-g.x)<25&&Math.abs(p.y+21-g.y)<30){g.got=true;gems++;score+=1000}});for(const e of es){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(p.inv<=0&&overlap(p,{x:e.x,y:e.y,w:e.w,h:e.h})){if(p.dash>0){e.v*=-1.8;p.vx=p.face*8}else{respawn();return}}}if(p.x>7040&&p.ground){score+=Math.max(0,Math.floor(5000-elapsed*60));if(score>best){best=score;localStorage.setItem('freefall_best',best)}state='complete'}if(p.y>900)respawn();cam+=(p.x-W*.34-cam)*.09;cam=Math.max(0,Math.min(7200-W,cam));camY+=(p.y-H*.48-camY)*.08;camY=Math.max(-80,Math.min(140,camY))}function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function sky(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#69bfe7');g.addColorStop(.55,'#9bdef1');g.addColorStop(1,'#e9f5df');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=-2;i<12;i++){let a=((i*520-cam*.16)%(W+700))-350,b=90+(i%3)*115-camY*.08;x.fillStyle='rgba(255,255,255,.52)';for(let j=0;j<4;j++){x.beginPath();x.arc(a+j*48,b-(j%2)*14,42+(j%2)*13,0,Math.PI*2);x.fill()}}for(let i=-1;i<9;i++){let a=i*980-cam*.25,b=250+(i%2)*120-camY*.15;x.fillStyle='rgba(76,145,157,.24)';x.beginPath();x.moveTo(a,b);x.lineTo(a+320,b+18);x.lineTo(a+255,b+75);x.lineTo(a+90,b+88);x.closePath();x.fill()}}function platform(q){let a=q.x-cam,b=q.y-camY;x.fillStyle='rgba(31,75,74,.12)';rr(a+7,b+9,q.w,q.h,12);x.fillStyle='#80664d';rr(a,b,q.w,q.h,12);x.fillStyle='#5f9b50';rr(a,b-7,q.w,15,8);x.strokeStyle='#79b85e';x.lineWidth=3;for(let i=18;i<q.w-10;i+=36){x.beginPath();x.moveTo(a+i,b);x.lineTo(a+i+3,b-7);x.stroke()}}function gem(g){if(g.got)return;let a=g.x-cam,b=g.y-camY+Math.sin(g.t)*5;x.save();x.translate(a,b);x.rotate(Math.PI/4);x.fillStyle='#f5c85b';x.shadowColor='rgba(255,225,100,.5)';x.shadowBlur=14;x.fillRect(-9,-9,18,18);x.shadowBlur=0;x.fillStyle='#fff4b4';x.fillRect(-4,-8,5,7);x.restore()}function enemy(e){let a=e.x-cam,b=e.y-camY;x.fillStyle='#445d62';rr(a,b,e.w,e.h,9);x.fillStyle='#f2c45c';x.beginPath();x.arc(a+8,b+10,3,0,Math.PI*2);x.fill();x.beginPath();x.arc(a+20,b+10,3,0,Math.PI*2);x.fill();x.fillStyle='#253a40';rr(a+8,b+18,14,5,3);x.fillStyle='#6f8e8f';x.fillRect(a-3,b+8,5,12);x.fillRect(a+e.w-2,b+8,5,12)}function player(){let a=p.x-cam,b=p.y-camY;x.save();if(p.inv>0&&Math.floor(p.inv/5)%2===0)x.globalAlpha=.45;if(p.dash>0)for(let i=1;i<5;i++){x.globalAlpha=.09*(5-i);x.fillStyle='#fff4b0';rr(a-p.face*i*15,b+7,p.w,p.h-10,9)}x.globalAlpha=1;x.fillStyle='#263c45';rr(a+5,b+10,20,28,8);x.fillStyle='#f0b36c';x.beginPath();x.arc(a+15,b+9,10,0,Math.PI*2);x.fill();x.fillStyle='#d46a3b';x.beginPath();x.arc(a+11,b+5,7,Math.PI,Math.PI*1.85);x.fill();x.fillStyle='#e8d27a';x.fillRect(a+4,b+14,22,5);x.fillStyle='#263c45';rr(a+4,b+35,8,8,4);rr(a+18,b+35,8,8,4);x.fillStyle='#23353b';x.fillRect(a+18+p.face*2,b+8,3,3);x.restore()}function text(t,y,s,w='700',col='#fff'){x.fillStyle=col;x.font=`${w} ${s}px system-ui`;x.textAlign='center';x.fillText(t,W/2,y);x.textAlign='left'}function ui(){x.fillStyle='rgba(21,45,54,.78)';rr(18,18,210,68,16);x.fillStyle='#fff';x.font='700 15px system-ui';x.fillText('FREE FALL',34,42);x.font='600 14px system-ui';x.fillStyle='rgba(255,255,255,.8)';x.fillText(`Gems  ${gems}/${gs.length}`,34,64);x.fillText(`Score  ${score.toLocaleString()}`,132,64);x.fillStyle='rgba(255,255,255,.6)';x.font='600 12px system-ui';x.fillText('SKY',W-54,35)}function menu(){sky();x.fillStyle='rgba(255,255,255,.68)';for(let i=0;i<7;i++){x.beginPath();x.arc(W*.17+i*58,H*.63-(i%2)*22,55+(i%3)*12,0,Math.PI*2);x.fill()}text('FREE FALL',H*.31,72,'800','#fff');text('Get the breadstick back.',H*.39,23,'500','rgba(255,255,255,.9)');x.fillStyle='#263c45';rr(W/2-130,H*.48,260,62,18);text('PLAY',H*.48+40,22,'800','#fff');text(`BEST SCORE  ${best.toLocaleString()}`,H*.72,14,'700','rgba(255,255,255,.8)');text('Move  A/D or ←/→   •   Jump  Space   •   Dash  Shift',H*.78,13,'500','rgba(255,255,255,.75)')}function complete(){sky();x.fillStyle='rgba(28,56,64,.18)';x.fillRect(0,0,W,H);text('YOU MADE IT.',H*.30,54,'800','#fff');text('The breadstick is safe. Probably.',H*.38,20,'500','rgba(255,255,255,.9)');text(`SCORE  ${score.toLocaleString()}`,H*.52,28,'800','#fff');text(`BEST  ${best.toLocaleString()}`,H*.59,16,'700','rgba(255,255,255,.8)');x.fillStyle='#263c45';rr(W/2-120,H*.67,240,56,16);text('PLAY AGAIN',H*.67+36,18,'800','#fff')}function draw(){x.clearRect(0,0,W,H);if(state==='menu'){menu();return}if(state==='complete'){complete();return}sky();ps.forEach(platform);gs.forEach(gem);es.forEach(enemy);player();ui()}c.addEventListener('pointerdown',()=>{if(state==='menu'||state==='complete')restart()});function loop(){update();draw();requestAnimationFrame(loop)}loop()})();
</script></body></html>
